<!DOCTYPE html>        
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kart Admin System 🏎️</title>
    <style>
        :root { --red: #ff4b4b; --dark: #0e1117; --card: #1d2129; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding-bottom: 70px; }
        .section { display: none; padding: 20px; }
        .active { display: block; }
        .navbar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid var(--red); z-index: 1000; }
        .nav-item { color: white; text-decoration: none; font-size: 12px; text-align: center; cursor: pointer; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #333; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--red); border: none; color: white; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        .form-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--card); border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252a34; color: var(--red); }
        tr:nth-child(even) { background: #252a34; }
        .import-box { border: 1px dashed #555; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="loading" style="padding: 20px; text-align: center;">Sincronizando boxes...</div>

<div id="dash" class="section active">
    <h2>🏆 Ranking</h2>
    <div class="form-card" style="margin-bottom: 15px; padding: 10px;">
        <select id="filtro_rank_camp" onchange="renderRanking()">
            <option value="">📊 Ranking Geral (Todos)</option>
        </select>
    </div>
    <div id="rankingContent">
        <p style="color: #888;">Carregando posições...</p>
    </div>
</div>

<div id="importar" class="section">
    <div class="form-card">
        <h2>📂 Importar e Persistir</h2>
        <p style="font-size: 12px; color: #888;">Selecione os 3 arquivos de uma vez (Segure Ctrl ou Shift) para salvar no GitHub.</p>
        
        <div class="import-box">
            <input type="file" id="fileInputMultiple" accept=".html" multiple>
            <button onclick="fazerBackupEProcessar()" style="background: #2196F3;">SALVAR TUDO NO HISTÓRICO E ANALISAR</button>
        </div>
        
        <div id="statusImport" style="text-align: center; font-size: 13px; color: #ffeb3b;"></div>
        <div id="previewImportacao" style="margin-top: 20px;"></div>
    </div>
</div>

<div id="lançar" class="section">
    <div class="form-card">
        <h2>🏎️ Lançar Corrida</h2>
        <input type="password" id="pass_res" placeholder="Senha ADM">
        <select id="sel_camp" onchange="filtrarPilotosPorCamp()"><option value="">Selecione o Campeonato</option></select>
        <select id="sel_piloto"><option value="">Selecione o Piloto</option></select>
        <input type="number" id="res_pos" placeholder="Posição Final">
        <input type="number" id="res_etapa" placeholder="Número da Etapa">
        <input type="date" id="res_data">
        <button onclick="salvar('resultados')">GRAVAR RESULTADO</button>
    </div>
</div>

<div id="cad_camp" class="section">
    <div class="form-card">
        <h2>🏁 Novo Campeonato</h2>
        <input type="password" id="pass_camp" placeholder="Senha ADM">
        <input type="text" id="camp_nome" placeholder="Nome do Campeonato">
        <textarea id="camp_desc" placeholder="Descrição"></textarea>
        <label>Início:</label><input type="date" id="camp_ini">
        <label>Fim (Opcional):</label><input type="date" id="camp_fim">
        <button onclick="salvar('campeonatos')">CADASTRAR</button>
    </div>
</div>

<div id="cad_piloto" class="section">
    <div class="form-card">
        <h2>👤 Novo Piloto</h2>
        <input type="password" id="pass_piloto" placeholder="Senha ADM">
        <input type="text" id="piloto_nome" placeholder="Nome Completo">
        <input type="text" id="piloto_apelido" placeholder="Apelido">
        <p style="font-size: 12px; color: #888;">Selecione os campeonatos:</p>
        <select id="piloto_vinc" multiple size="5"></select>
        <button onclick="salvar('pilotos')">CADASTRAR PILOTO</button>
    </div>
</div>

<nav class="navbar">
    <div class="nav-item" onclick="show('dash')">📊<br>Rank</div>
    <div class="nav-item" onclick="show('importar')">📂<br>Importar</div>
    <div class="nav-item" onclick="show('lançar')">⏱️<br>Lançar</div>
    <div class="nav-item" onclick="show('cad_camp')">🏁<br>Camps</div>
    <div class="nav-item" onclick="show('cad_piloto')">👤<br>Pilotos</div>
</nav>

<script>
    // --- CONFIGURAÇÃO ---
    const URL_API = "https://script.google.com/macros/s/AKfycbwWIL3hrPq6w6pCjCS5-ZYwv3hAY8Rr1ZjYxC-tEh7f9enmpTsZ7fzu9ilWpioQGQEc/exec";
    const GITHUB_USER = "P3dro-crypto";
    const GITHUB_REPO = "ranking-kart";
    const TOKEN_GITHUB = "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";

    let DB = { campeonatos: [], pilotos: [], resultados: [] };

    const MEUS_PILOTOS = [
        {id: "41938", nome: "LEONARDO LEMES"},
        {id: "231138", nome: "RODRIGO CRUZ"},
        {id: "232869", nome: "JOÃO VICTOR"},
        {id: "4196", nome: "JÚLIO CEZAR"},
        {id: "51107", nome: "DANILO OLIVEIRA"},
        {id: "232984", nome: "FRANCISCO CAMILLO"},
        {id: "232194", nome: "LUCAS OLIVEIRA"}
    ];

    // CARREGAR DADOS INICIAIS
    async function fetchData() {
        try {
            const res = await fetch(URL_API);
            DB = await res.json();
            document.getElementById('loading').style.display = 'none';
            popularFiltros();
            renderRanking();
        } catch (erro) {
            console.error("Erro:", erro);
        }
    }

    // NAVEGAÇÃO
    function show(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // BACKUP MÚLTIPLO NO GITHUB
    async function fazerBackupEProcessar() {
        const fileInput = document.getElementById('fileInputMultiple');
        const files = fileInput.files;
        const status = document.getElementById('statusImport');

        if (files.length === 0) return alert("Selecione os arquivos!");
        
        status.innerHTML = `⏳ Processando ${files.length} arquivos...`;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const nomeMinusculo = file.name.toLowerCase();
            
            // Define o tipo baseado no nome do arquivo automaticamente
            let tipo = "anexo";
            if (nomeMinusculo.includes("final")) tipo = "resultado_final";
            else if (nomeMinusculo.includes("volta")) tipo = "volta_a_volta";
            else if (nomeMinusculo.includes("grid") || nomeMinusculo.includes("classi")) tipo = "classificacao";

            status.innerHTML = `⏳ Enviando (${i+1}/${files.length}): ${file.name}`;

            const conteudoRaw = await file.text();
            const conteudoBase64 = btoa(unescape(encodeURIComponent(conteudoRaw)));
            const dataPath = new Date().toISOString().split('T')[0];
            const caminho = `historico-corridas/${dataPath}-${tipo}-${file.name}`;

            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${caminho}`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${TOKEN_GITHUB}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `Backup Automático: ${file.name}`, content: conteudoBase64 })
                });

                if (res.ok) {
                    // Se for o arquivo de resultado final, mostra os botões de lançar
                    if (tipo === "resultado_final") analisarHTML(conteudoRaw);
                }
            } catch (err) {
                console.error("Erro ao enviar:", file.name);
            }
        }
        status.innerHTML = `✅ ${files.length} arquivos salvos com sucesso no GitHub!`;
    }

    // ANALISAR O HTML FILTRANDO PELO CAMPEONATO
    function analisarHTML(htmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const rows = doc.querySelectorAll('tr');
        const preview = document.getElementById('previewImportacao');
        let encontrados = [];

        rows.forEach(row => {
            const texto = row.innerText;
            MEUS_PILOTOS.forEach(p => {
                if (texto.includes(p.id)) {
                    const cols = Array.from(row.querySelectorAll('td')).map(td => td.innerText.trim());
                    encontrados.push({ nome: p.nome, pos: cols[0], original: cols.join(' | ') });
                }
            });
        });

        if (encontrados.length === 0) {
            preview.innerHTML = "<p>Nenhum piloto do seu campeonato encontrado no resultado final.</p>";
            return;
        }

        let htmlPreview = "<h3>Pilotos Identificados no Resultado:</h3>";
        encontrados.forEach(item => {
            htmlPreview += `
                <div class="form-card" style="background:#252a34; font-size:12px; margin-bottom:10px;">
                    <strong>${item.nome}</strong> - Posição: ${item.pos}<br>
                    <button onclick="preencherCadastro('${item.nome}', '${item.pos}')" style="padding:5px; width:auto; font-size:10px;">Lançar este resultado</button>
                </div>`;
        });
        preview.innerHTML = htmlPreview;
    }

    function preencherCadastro(nome, pos) {
        show('lançar');
        document.getElementById('sel_piloto').value = nome;
        document.getElementById('res_pos').value = parseInt(pos) || "";
        alert("Dados enviados para a aba Lançar!");
    }

    // RESTANTE DAS FUNÇÕES ORIGINAIS
    function renderRanking() {
        const container = document.getElementById('rankingContent');
        const filtroCamp = document.getElementById('filtro_rank_camp').value; 
        if (!DB.resultados || DB.resultados.length === 0) {
            container.innerHTML = "<p style='color: #888;'>Nenhum resultado lançado.</p>";
            return;
        }
        const soma = {};
        const resultadosFiltrados = filtroCamp ? DB.resultados.filter(r => (r.campeonato || r.Campeonato) === filtroCamp) : DB.resultados;
        resultadosFiltrados.forEach(r => {
            const nome = r.piloto || r.Piloto;
            const pts = parseInt(r.pontos || r.Pontos) || 0;
            if (nome) soma[nome] = (soma[nome] || 0) + pts;
        });
        const rankingSorted = Object.entries(soma)
            .map(([nome, pontos]) => {
                const pDados = DB.pilotos.find(p => p.nome === nome);
                return { nome, apelido: pDados ? pDados.apelido : "", pontos };
            })
            .sort((a, b) => b.pontos - a.pontos);

        let html = `<table><tr><th>Pos</th><th>Piloto</th><th>Pts</th></tr>`;
        rankingSorted.forEach((p, i) => {
            html += `<tr><td>${i + 1}º</td><td>${p.nome}</td><td>${p.pontos}</td></tr>`;
        });
        container.innerHTML = html + `</table>`;
    }

    function popularFiltros() {
        const opts = DB.campeonatos.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
        document.getElementById('filtro_rank_camp').innerHTML = '<option value="">📊 Ranking Geral</option>' + opts;
        document.getElementById('sel_camp').innerHTML = '<option value="">Selecione o Campeonato</option>' + opts;
        document.getElementById('piloto_vinc').innerHTML = opts;
    }

    function filtrarPilotosPorCamp() {
        const campSel = document.getElementById('sel_camp').value;
        const filtrados = DB.pilotos.filter(p => p.vinculos && p.vinculos.includes(campSel));
        document.getElementById('sel_piloto').innerHTML = filtrados.map(p => `<option value="${p.nome}">${p.nome}</option>`).join('');
    }

    async function salvar(tipo) {
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "⏳ ENVIANDO...";
        btn.disabled = true;

        let payload = { tipo: tipo };
        if(tipo === 'resultados') {
            payload.senha = document.getElementById('pass_res').value;
            payload.campeonato = document.getElementById('sel_camp').value;
            payload.piloto = document.getElementById('sel_piloto').value;
            payload.posicao = document.getElementById('res_pos').value;
            payload.etapa = document.getElementById('res_etapa').value;
            payload.data = document.getElementById('res_data').value;
        } else if(tipo === 'campeonatos') {
            payload.senha = document.getElementById('pass_camp').value;
            payload.nome = document.getElementById('camp_nome').value;
            payload.descricao = document.getElementById('camp_desc').value;
            payload.inicio = document.getElementById('camp_ini').value;
        } else if(tipo === 'pilotos') {
            payload.senha = document.getElementById('pass_piloto').value;
            payload.nome = document.getElementById('piloto_nome').value;
            payload.vinculos = Array.from(document.getElementById('piloto_vinc').selectedOptions).map(o => o.value).join(', ');
        }

        try {
            const res = await fetch(URL_API, { method: 'POST', body: JSON.stringify(payload) });
            const txt = await res.text();
            if (txt.includes("Sucesso")) {
                btn.innerText = "✅ SUCESSO!";
                setTimeout(() => location.reload(), 1500);
            } else { alert("Erro: Senha incorreta"); btn.disabled = false; btn.innerText = originalText; }
        } catch (e) { alert("Erro na conexão"); btn.disabled = false; btn.innerText = originalText; }
    }

    fetchData();
</script>
</body>
</html>
