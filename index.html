<!DOCTYPE html>        
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kart Admin System 🏎️</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --red: #ff4b4b; --dark: #0e1117; --card: #1d2129; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding-bottom: 70px; }
        .section { display: none; padding: 20px; }
        .active { display: block; }
        .navbar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid var(--red); z-index: 1000; }
        .nav-item { color: white; text-decoration: none; font-size: 11px; text-align: center; cursor: pointer; min-width: 50px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #333; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--red); border: none; color: white; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        .form-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--card); border-radius: 10px; overflow: hidden; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252a34; color: var(--red); }
        tr:nth-child(even) { background: #252a34; }
        .btn-view { background: #4CAF50; padding: 5px 10px; font-size: 10px; width: auto; margin: 0; }
        .piloto-card { display: flex; justify-content: space-between; align-items: center; background: #252a34; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--red); }
    </style>
</head>
<body>

<div id="loading" style="padding: 20px; text-align: center;">Sincronizando boxes...</div>

<div id="dash" class="section active">
    <h2>🏆 Ranking</h2>
    <div class="form-card">
        <select id="filtro_rank_camp" onchange="renderRanking()"></select>
    </div>
    <div id="rankingContent"></div>
</div>

<div id="historico" class="section">
    <h2>📜 Histórico de Backups</h2>
    <div id="listaHistorico">Carregando arquivos...</div>
</div>

<div id="importar" class="section">
    <div class="form-card">
        <h2>📂 Importar Arquivos</h2>
        <input type="file" id="fileInputMultiple" accept=".html" multiple>
        <button onclick="fazerBackupEProcessar()" style="background: #2196F3;">SALVAR NO FIREBASE</button>
        <div id="statusImport" style="text-align: center; margin-top: 10px; color: #ffeb3b;"></div>
        <div id="previewImportacao" style="margin-top: 15px;"></div>
    </div>
</div>

<div id="lançar" class="section">
    <div class="form-card">
        <h2>🏎️ Lançar Corrida</h2>
        <input type="password" id="pass_res" placeholder="Senha ADM">
        <select id="sel_camp" onchange="filtrarPilotosPorCamp()"></select>
        <select id="sel_piloto">
            <option value="">Selecione o Piloto</option>
        </select>
        <input type="number" id="res_pos" placeholder="Posição Final">
        <input type="number" id="res_etapa" placeholder="Número da Etapa">
        <input type="date" id="res_data">
        <button onclick="salvar('resultados')">GRAVAR NO GOOGLE SHEETS</button>
    </div>
</div>

<nav class="navbar">
    <div class="nav-item" onclick="show('dash')">📊<br>Rank</div>
    <div class="nav-item" onclick="show('historico'); carregarHistorico();">📜<br>Histórico</div>
    <div class="nav-item" onclick="show('importar')">📂<br>Importar</div>
    <div class="nav-item" onclick="show('lançar')">⏱️<br>Lançar</div>
</nav>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCGaQnACY0Qi7efLxL0PZ5-X3rbLBGaPyk",
        authDomain: "ranking-kart-system.firebaseapp.com",
        databaseURL: "https://ranking-kart-system-default-rtdb.firebaseio.com",
        projectId: "ranking-kart-system",
        storageBucket: "ranking-kart-system.firebasestorage.app",
        messagingSenderId: "933803342903",
        appId: "1:933803342903:web:9f7d6a5f7e7e8c1b9a9d1c"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const URL_API = "https://script.google.com/macros/s/AKfycbwWIL3hrPq6w6pCjCS5-ZYwv3hAY8Rr1ZjYxC-tEh7f9enmpTsZ7fzu9ilWpioQGQEc/exec";

    let DB = { campeonatos: [], pilotos: [], resultados: [] };
    const MEUS_PILOTOS = [{id: "41938", nome: "LEONARDO LEMES"}, {id: "231138", nome: "RODRIGO CRUZ"}, {id: "232869", nome: "JOÃO VICTOR"}, {id: "4196", nome: "JÚLIO CEZAR"}, {id: "51107", nome: "DANILO OLIVEIRA"}, {id: "232984", nome: "FRANCISCO CAMILLO"}, {id: "232194", nome: "LUCAS OLIVEIRA"}];

    async function fetchData() {
        try {
            const res = await fetch(URL_API);
            DB = await res.json();
            document.getElementById('loading').style.display = 'none';
            popularFiltros();
            renderRanking();
        } catch (e) { console.error(e); }
    }

    function show(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function fazerBackupEProcessar() {
        const files = document.getElementById('fileInputMultiple').files;
        const status = document.getElementById('statusImport');
        if (files.length === 0) return alert("Selecione os arquivos!");
        
        status.innerHTML = "⏳ Fazendo Backup...";
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const conteudoRaw = await file.text();
            const idUnico = Date.now() + "_" + i;
            await database.ref('backups/' + idUnico).set({
                nomeArquivo: file.name,
                dataUpload: new Date().toLocaleString('pt-BR'),
                conteudo: conteudoRaw
            });
            if (file.name.toLowerCase().includes("final")) analisarHTML(conteudoRaw);
        }
        status.innerHTML = "✅ Salvo no Firebase!";
    }

    function analisarHTML(htmlText) {
        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
        const rows = doc.querySelectorAll('tr');
        let encontrados = [];
        rows.forEach(row => {
            MEUS_PILOTOS.forEach(p => {
                if (row.innerText.includes(p.id)) {
                    encontrados.push({ nome: p.nome, pos: row.querySelectorAll('td')[0].innerText.trim() });
                }
            });
        });
        
        let h = "<h3>Pilotos Identificados:</h3>";
        encontrados.forEach(i => {
            h += `<div class="piloto-card">
                    <span><strong>${i.nome}</strong> (P${i.pos})</span>
                    <button onclick="preencher('${i.nome}','${i.pos}')" style="width:auto; padding:5px 15px; margin:0; font-size:12px;">Lançar</button>
                  </div>`;
        });
        document.getElementById('previewImportacao').innerHTML = h;
    }

    // FUNÇÃO QUE VOCÊ PEDIU: AGORA ELA PREENCHE TUDO!
    function preencher(nome, pos) {
        show('lançar');
        
        // 1. Garante que o seletor de pilotos tenha esse piloto (mesmo que o filtro de camp não esteja ativo)
        const selPiloto = document.getElementById('sel_piloto');
        if (!Array.from(selPiloto.options).some(opt => opt.value === nome)) {
            const opt = document.createElement('option');
            opt.value = nome;
            opt.text = nome;
            selPiloto.add(opt);
        }
        
        // 2. Preenche os campos
        selPiloto.value = nome;
        document.getElementById('res_pos').value = parseInt(pos);
        
        // 3. Coloca o cursor na etapa pra você ganhar tempo
        document.getElementById('res_etapa').focus();
    }

    function carregarHistorico() {
        const lista = document.getElementById('listaHistorico');
        database.ref('backups').limitToLast(15).once('value', (snapshot) => {
            let html = "<table><tr><th>Arquivo</th><th>Data</th><th>Ação</th></tr>";
            snapshot.forEach((child) => {
                const item = child.val();
                html += `<tr>
                    <td style="font-size:11px">${item.nomeArquivo}</td>
                    <td style="font-size:11px">${item.dataUpload.split(' ')[0]}</td>
                    <td><button class="btn-view" onclick="verConteudo('${child.key}')">VER</button></td>
                </tr>`;
            });
            lista.innerHTML = html + "</table>";
        });
    }

    function verConteudo(key) {
        database.ref('backups/' + key).once('value', (s) => {
            const win = window.open("", "_blank");
            win.document.write(s.val().conteudo);
        });
    }

    function renderRanking() {
        const f = document.getElementById('filtro_rank_camp').value;
        const res = f ? DB.resultados.filter(r => (r.campeonato || r.Campeonato) === f) : DB.resultados;
        const soma = {};
        res.forEach(r => { const n = r.piloto || r.Piloto; soma[n] = (soma[n] || 0) + (parseInt(r.pontos || r.Pontos) || 0); });
        const sorted = Object.entries(soma).sort((a,b) => b[1] - a[1]);
        let h = "<table><tr><th>Pos</th><th>Piloto</th><th>Pts</th></tr>";
        sorted.forEach((p, i) => h += `<tr><td>${i+1}º</td><td>${p[0]}</td><td>${p[1]}</td></tr>`);
        document.getElementById('rankingContent').innerHTML = h + "</table>";
    }

    function popularFiltros() {
        const opts = DB.campeonatos.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
        document.getElementById('filtro_rank_camp').innerHTML = '<option value="">📊 Ranking Geral</option>' + opts;
        document.getElementById('sel_camp').innerHTML = '<option value="">Selecione o Campeonato</option>' + opts;
        
        // Popular o seletor de pilotos com TODOS inicialmente
        const pOpts = DB.pilotos.map(p => `<option value="${p.nome}">${p.nome}</option>`).sort().join('');
        document.getElementById('sel_piloto').innerHTML = '<option value="">Selecione o Piloto</option>' + pOpts;
    }

    function filtrarPilotosPorCamp() {
        const c = document.getElementById('sel_camp').value;
        if(!c) return;
        const p = DB.pilotos.filter(pil => pil.vinculos && pil.vinculos.includes(c));
        document.getElementById('sel_piloto').innerHTML = '<option value="">Selecione o Piloto</option>' + p.map(pil => `<option value="${pil.nome}">${pil.nome}</option>`).join('');
    }

    async function salvar(tipo) {
        const btn = event.target; btn.innerText = "⏳ ENVIANDO..."; btn.disabled = true;
        let p = { tipo: tipo };
        if(tipo === 'resultados') {
            p.senha = document.getElementById('pass_res').value;
            p.campeonato = document.getElementById('sel_camp').value;
            p.piloto = document.getElementById('sel_piloto').value;
            p.posicao = document.getElementById('res_pos').value;
            p.etapa = document.getElementById('res_etapa').value;
            p.data = document.getElementById('res_data').value;
        }
        try {
            const r = await fetch(URL_API, { method: 'POST', body: JSON.stringify(p) });
            const t = await r.text();
            if (t.includes("Sucesso")) { alert("✅ Corrida gravada com sucesso!"); location.reload(); }
            else { alert("❌ Erro: Senha incorreta ou dados faltando."); btn.disabled = false; btn.innerText = "GRAVAR NO GOOGLE SHEETS"; }
        } catch (e) { alert("Erro de rede"); btn.disabled = false; }
    }

    fetchData();
</script>
</body>
</html>
